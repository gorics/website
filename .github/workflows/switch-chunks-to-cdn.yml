name: FlyBrain Hybrid V3 Fast SSD1B

on:
  push:
    branches:
      - flybrain-hybrid-run
    paths:
      - .github/workflows/switch-chunks-to-cdn.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: flybrain-hybrid-run
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU ML stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.48,<5' 'diffusers>=0.33,<1' accelerate safetensors sentencepiece pillow numpy huggingface_hub
      - name: Fetch FlyBrain and fast runner
        run: |
          mkdir -p flybrain_ai
          curl -fL https://raw.githubusercontent.com/gorics/detect-bot/flybrain-hybrid-run/flybrain_ai/v3_ssd1b_fast.py -o flybrain_ai/v3_ssd1b_fast.py
          git clone --depth 1 https://github.com/snedea/flybrain.git flybrain-src
          git -C flybrain-src rev-parse HEAD | tee flybrain_upstream_commit.txt
      - name: Train bridge and generate SSD-1B image
        run: python flybrain_ai/v3_ssd1b_fast.py 2>&1 | tee flybrain_v3_fast.log
      - name: Upload V3 fast results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-v3-fast-ssd1b-${{ github.run_id }}
          path: |
            flybrain_ai/results_v3_fast/**
            flybrain_v3_fast.log
            flybrain_upstream_commit.txt
          if-no-files-found: warn
          retention-days: 3
      - name: Persist readable result
        if: always()
        run: |
          target='flybrain-run-output/v3-fast-latest'
          rm -rf "$target"; mkdir -p "$target"
          cp flybrain_ai/results_v3_fast/results_v3_fast.json "$target/results_v3_fast.json" 2>/dev/null || true
          cp flybrain_v3_fast.log "$target/run.log" 2>/dev/null || true
          echo -n "$GITHUB_RUN_ID" > "$target/run_id.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist FlyBrain V3 fast results [skip ci]'
          git push origin HEAD:flybrain-hybrid-run
